pluginGroup = bladevueconnector
pluginName = Blade Vue Connector
pluginRepositoryUrl = https://github.com/tanerkay/blade-vue-connector
pluginVersion = 0.1.0

# Supported build number ranges -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 253

# Build and test against 2026.2: in 2025.3 the Vue plugin fails to initialise under the test framework.
# Compatibility with the older IDEs in the since-build range is checked by verifyPlugin.
platformVersion = 2026.2.2
platformBundledPlugins = com.jetbrains.php,com.jetbrains.php.blade,JavaScript,org.jetbrains.plugins.vue

# Optional: build, test and run against a local PhpStorm installation instead of downloading one,
# e.g. -PlocalIdePath=/snap/phpstorm/current
# localIdePath =

gradleVersion = 9.7.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
